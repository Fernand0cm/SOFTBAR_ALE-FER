<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de venta de SOFTBAR</title>
  <desc id="desc">Mapa del recorrido operativo desde apertura de turno hasta ticket y cierre de caja.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}
      .card{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
      .main{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}
      .warn{fill:#fff7ed;stroke:#fb923c;stroke-width:2}
      .text{font-family:Arial,Helvetica,sans-serif;fill:#172a2a}
      .title{font-size:28px;font-weight:700}
      .label{font-size:19px;font-weight:700}
      .small{font-size:15px}
      .line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1100" height="620"/>
  <text x="60" y="55" class="text title">Flujo funcional de venta</text>
  <text x="60" y="85" class="text small">Recorrido principal defendible: turno, venta, cobro, factura, ticket y caja.</text>

  <rect x="70" y="150" width="165" height="82" rx="12" class="main"/>
  <text x="152" y="181" text-anchor="middle" class="text label">Abrir turno</text>
  <text x="152" y="207" text-anchor="middle" class="text small">Importe inicial</text>

  <rect x="295" y="80" width="165" height="82" rx="12" class="main"/>
  <text x="377" y="111" text-anchor="middle" class="text label">Sala</text>
  <text x="377" y="137" text-anchor="middle" class="text small">Mesa y comanda</text>

  <rect x="295" y="225" width="165" height="82" rx="12" class="main"/>
  <text x="377" y="256" text-anchor="middle" class="text label">Barra</text>
  <text x="377" y="282" text-anchor="middle" class="text small">Pedido directo</text>

  <rect x="520" y="150" width="165" height="82" rx="12" class="main"/>
  <text x="602" y="181" text-anchor="middle" class="text label">Cobro</text>
  <text x="602" y="207" text-anchor="middle" class="text small">Efectivo/tarjeta/mixto</text>

  <rect x="745" y="150" width="165" height="82" rx="12" class="main"/>
  <text x="827" y="181" text-anchor="middle" class="text label">Venta</text>
  <text x="827" y="207" text-anchor="middle" class="text small">Factura y ticket</text>

  <rect x="745" y="315" width="165" height="82" rx="12" class="main"/>
  <text x="827" y="346" text-anchor="middle" class="text label">Caja</text>
  <text x="827" y="372" text-anchor="middle" class="text small">Resumen del turno</text>

  <rect x="520" y="430" width="165" height="82" rx="12" class="warn"/>
  <text x="602" y="461" text-anchor="middle" class="text label">Cierre</text>
  <text x="602" y="487" text-anchor="middle" class="text small">Arqueo y diferencia</text>

  <path d="M235 191 C260 120 270 121 295 121" class="line"/>
  <path d="M235 191 C260 265 270 266 295 266" class="line"/>
  <path d="M460 121 C495 145 505 165 520 191" class="line"/>
  <path d="M460 266 C495 240 505 215 520 191" class="line"/>
  <path d="M685 191 L745 191" class="line"/>
  <path d="M827 232 L827 315" class="line"/>
  <path d="M745 356 C700 405 690 440 685 471" class="line"/>
  <path d="M602 430 C545 350 545 255 520 205" class="line"/>

  <text x="70" y="560" class="text small">La app bloquea cobros sin turno abierto y guarda usuario, turno, lineas, metodo, desglose de pago, factura y ticket.</text>
</svg>
