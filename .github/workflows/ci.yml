name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pruebas-android:
    name: Pruebas unitarias Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Permisos de gradlew
        run: chmod +x ./gradlew

      - name: Ejecutar pruebas unitarias
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Publicar informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas-android
          path: app/build/reports/tests/testDebugUnitTest

  pruebas-reglas:
    name: Pruebas de reglas Firestore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Configurar JDK 17 (emulador de Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        working-directory: firestore-tests
        run: npm ci

      - name: Ejecutar pruebas de reglas en el emulador
        working-directory: firestore-tests
        run: npm test
